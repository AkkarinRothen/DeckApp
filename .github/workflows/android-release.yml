name: Android release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    if: github.actor == 'AkkarinRothen'
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure version and signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Missing Android signing secrets. See docs/planning/ANDROID_UPDATER.md." >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "Release tag must use vMAJOR.MINOR.PATCH, for example v0.1.2." >&2
            exit 1
          fi
          if (( major > 2000 || minor > 999 || patch > 999 )); then
            echo "Version components exceed the supported Android versionCode range." >&2
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deckapp-release.keystore"
          echo "DECKAPP_RELEASE_STORE_FILE=$RUNNER_TEMP/deckapp-release.keystore" >> "$GITHUB_ENV"
          echo "DECKAPP_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DECKAPP_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DECKAPP_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "DECKAPP_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "DECKAPP_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: >-
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          -PdeckappVersionName="$DECKAPP_VERSION_NAME"
          -PdeckappVersionCode="$DECKAPP_VERSION_CODE"

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose "$apk"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          "$aapt_path" dump badging "$apk" | grep -F "package: name='com.deckapp.ttrpg'"
          cp "$apk" "$RUNNER_TEMP/DeckApp.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/DeckApp.apk#DeckApp.apk" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
